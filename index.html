<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172451">
<meta name="description" content="Tienda La Diana se encuentra temporalmente cerrada. Volveremos pronto.">
<title>Tienda La Diana | Temporalmente cerrada</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172445;background:#f5f7fd}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:30px 18px;background:radial-gradient(circle at 17% 12%,#e2eafe 0,transparent 38%),radial-gradient(circle at 86% 85%,#fceecf 0,transparent 37%),#f5f7fd}
main{width:min(100%,610px);background:#fff;border:1px solid #e4eaf5;border-radius:28px;padding:clamp(32px,7vw,64px) clamp(22px,6vw,52px);text-align:center;box-shadow:0 25px 85px #17244518}
.icon{width:94px;height:94px;border-radius:26px;display:grid;place-items:center;margin:0 auto 26px;background:#eef2ff;font-size:50px}
.brand{font-size:16px;text-transform:uppercase;letter-spacing:2.6px;color:#3d55ac;font-weight:850;margin:0 0 13px}
.status{display:inline-flex;align-items:center;gap:9px;border-radius:99px;padding:9px 15px;background:#fff4e5;color:#92530f;font-size:13px;font-weight:800;margin:0 0 23px}
.status-dot{width:9px;height:9px;border-radius:50%;background:#df9224}
h1{font-size:clamp(30px,6vw,46px);line-height:1.13;letter-spacing:-1.3px;color:#172451;margin:0 0 18px}
p{font-size:17px;line-height:1.7;color:#586780;margin:0}
.divider{height:1px;background:#e9edf5;margin:29px 0 23px}
.note{font-size:15px;color:#506080}
.heart{color:#d39a3a}
footer{font-size:12px;color:#8190aa;margin-top:26px}
</style>
</head>
<body>
<main>
<div class="icon" aria-hidden="true">🏪</div>
<p class="brand">Tienda La Diana</p>
<div class="status"><span class="status-dot"></span> Aviso importante</div>
<h1>Temporalmente cerrada</h1>
<p>En este momento nuestra tienda no está recibiendo pedidos.</p>
<p>Estamos realizando algunos ajustes para brindarte un mejor servicio.</p>
<div class="divider"></div>
<p class="note">¡Gracias por tu comprensión! <span class="heart">♥</span><br>Volveremos pronto.</p>
<footer>TIENDA LA DIANA · NOS VEMOS PRONTO</footer>
</main>
</body>
</html>
